[package]
name = "radar-arpa-trainer"
version = "0.1.0"
edition = "2021"
description = "Radar- und ARPA-Trainingssimulator (Windows / macOS / Linux)"

[dependencies]
eframe = "0.31"
png = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"

# Auch Debug-Builds flüssig halten (Radarvideo wird pro Pixel berechnet)
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[build-dependencies]
winresource = "0.1.34"

# für `cargo bundle --release` (macOS .app)
[package.metadata.bundle]
name = "Radar ARPA Trainer"
identifier = "de.training.radar-arpa-trainer"
category = "Education"
icon = ["assets/icon.icns"]
